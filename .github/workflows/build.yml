name: Build Tactical NPCs

on:
  push:
    branches: [ main, integrate-gradle-project ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'
      - name: Build mod
        run: gradle --no-daemon clean build
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-npcs-build
          path: |
            build/libs/*.jar
            build/reports/**
          if-no-files-found: warn
          retention-days: 14
